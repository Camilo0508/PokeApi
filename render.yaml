# Infraestructura en Render: los dos microservicios y la base relacional.
#
#   pokemon-service   Node + Express        ->  PostgreSQL (la crea Render, abajo)
#   profesor-service  Node sin Express      ->  PostgreSQL (la misma base, tabla "docente")
#   onepiece-service  Python/FastAPI        ->  MongoDB Atlas (MONGODB_URI se pone en el panel)
#
# Render no tiene MongoDB gestionado, por eso esa va en Atlas.

databases:
  # OJO: la base gratis de Render se borra a los 30 días de creada
  - name: pokeapi-db
    plan: free
    databaseName: pokeapi
    user: pokeapi

services:
  - type: web
    name: pokemon-service
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Render conecta sola la base de arriba con el servicio
      - key: DATABASE_URL
        fromDatabase:
          name: pokeapi-db
          property: connectionString

  - type: web
    name: profesor-service
    runtime: node
    plan: free
    rootDir: backend-profesor
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pokeapi-db
          property: connectionString

  - type: web
    name: onepiece-service
    runtime: python
    plan: free
    rootDir: backend-onepiece
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Esta se escribe a mano en el panel de Render (es secreta): la de MongoDB Atlas
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: onepiece
  - type: web
    name: asistente-service
    runtime: node
    plan: free
    rootDir: backend-asistente
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Qué IA responde: gemini (gratis, por defecto) o claude
      - key: IA_PROVEEDOR
        value: gemini
      # Secretas: se escriben a mano en el panel de Render
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: POKEMON_API_URL
        value: https://pokemon-service-p33l.onrender.com
      - key: ONEPIECE_API_URL
        value: https://onepiece-service-uewr.onrender.com
      - key: DOCENTES_API_URL
        value: https://profesor-service-0pmh.onrender.com